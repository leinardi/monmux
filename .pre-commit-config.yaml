repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # Fixtures are byte-for-byte captures of another tool's output, and a
      # formatter that tidies them makes them prove something other than what
      # was captured.
      - id: end-of-file-fixer
        exclude: (^|/)testdata/
      - id: trailing-whitespace
        exclude: (^|/)testdata/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  # Before markdownlint, because this rewrites a Markdown file and the linter has
  # to see the result. `go generate` rather than `make go-generate`: the Makefile
  # fetches the shared .mk snippets over the network on first run, which a commit
  # hook must never do.
  - repo: local
    hooks:
      - id: go-generate-catalog
        name: models_gen.go and compatibility.md are generated from models.yaml
        entry: go generate ./internal/catalog/...
        language: system
        pass_filenames: false
        # The generator's own sources are here too: internal/input decides the
        # Input column's text and the row order, so editing it moves the
        # document. TestGeneratedCatalogMatchesTheYAML and
        # TestCompatibilityDocumentMatchesTheGenerator are the gate; this hook is
        # the convenience that fixes the file for you.
        files: '^(internal/catalog/models\.yaml|docs/compatibility\.md|internal/catalog/catalog\.go|internal/catalog/internal/(generate|input)/.*\.go)$'
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        entry: shellcheck
        language: system
        types: [shell]
        args: ["-f", "json", "-x"]
        stages: [manual]
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.7.4"]
        files: \.(yml|yaml)$
        args: ["--write"]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full
        types: [file]
        files: '(\.go$|^go\.(mod|sum)$|^\.golangci\.(yml|yaml|toml|json)$)'
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      # The hook's own filter is Go files and go.mod. The supported-monitor
      # catalog is written in internal/catalog/models.yaml and rendered into a
      # committed Go file and into the generated sections of the compatibility
      # document, so a commit that edits only one of those would stage no Go
      # file, skip the suite, and let a stale rendering through.
      # TestGeneratedCatalogMatchesTheYAML and
      # TestCompatibilityDocumentMatchesTheGenerator are what catch that, so the
      # suite has to run for both files too.
      - id: go-test-repo-mod
        files: '(\.go$)|(\bgo\.mod$)|(^internal/catalog/models\.yaml$)|(^docs/compatibility\.md$)'
