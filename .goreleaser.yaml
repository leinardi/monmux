# The release build. Everything here is driven by .github/workflows/release.yaml;
# nothing in it runs monmux, and nothing in it touches a monitor.
#
# Verify a change to this file locally with:
#
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign
#
# (`sign` is skipped because cosign signs keyless, through the workflow's OIDC
# identity, which a laptop does not have.)
version: 2

project_name: monmux

# One build per OS, so that the packages and the cask can each name the one
# they belong to: nfpm takes the Linux archives and the Homebrew cask takes the
# macOS one, instead of a single archive that would put Linux URLs in a cask
# nobody can use them from.
#
# .Tag rather than .Version in the ldflags, so `monmux version` prints `v1.2.3`
# exactly as a `make go-build` binary does - that one takes it from
# `git describe`. .CommitDate rather than .Date: the release job builds twice,
# once to check and once to publish, and an invocation timestamp would make the
# two differ for no reason. Everything stamped into the binary now comes from the
# commit, so the same commit builds the same bytes.
builds:
  - id: monmux-linux
    main: ./cmd/monmux
    binary: monmux
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}

  - id: monmux-darwin
    main: ./cmd/monmux
    binary: monmux
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
    # arm64 only: the macOS backend wraps m1ddc, which requires Apple Silicon.
    # An Intel binary that can never work would be a promise monmux cannot keep.
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}

archives:
  - id: monmux-linux
    ids:
      - monmux-linux
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  - id: monmux-darwin
    ids:
      - monmux-darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The checksum file is signed, so one signature covers every artifact: verify
# the bundle, then verify a download against the file it signs. Keyless, through
# the release workflow's OIDC identity - there is no private key anywhere.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

nfpms:
  - id: monmux
    ids:
      - monmux-linux
    package_name: monmux
    vendor: Roberto Leinardi
    homepage: https://github.com/leinardi/monmux
    maintainer: Roberto Leinardi <leinardi@gmail.com>
    license: Apache-2.0
    section: utils
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    # Without this, nfpm stamps the package and every file in it with the clock,
    # so two builds of one commit produce different bytes - which they did on
    # v0.5.0, where the dry-run packages and the published ones differed while
    # the archives matched. mod_timestamp covers the binary only. The recovery
    # procedure rebuilds a tagged commit and expects the same artifacts, so the
    # packages have to come from the commit too.
    mtime: "{{ .CommitDate }}"
    # Unversioned on purpose. monmux needs ddcutil 2.2, but Debian 12 and
    # Ubuntu 24.04 ship 1.4, and a versioned dependency would make the package
    # refuse to install there - including for somebody who built 2.2 into
    # /usr/local, which dpkg cannot see. The floor is enforced where it can be
    # checked properly: preflight refuses with backend-not-ready and names the
    # version it found, and `monmux doctor` says what is needed. See
    # docs/release.md.
    dependencies:
      - ddcutil
    description: |-
      Switch supported monitors between video inputs.
      monmux is fail-closed: it writes to a monitor only when that monitor is positively
      identified from its EDID as a model in its built-in catalog, and the requested input
      is enabled for that model with evidence from real hardware.
      It drives ddcutil, which must be version 2.2 or newer; `monmux doctor` reports
      whether the one installed is usable.
    file_name_template: "{{ .ConventionalFileName }}"
    # Each file twice, once per packager, because `type: license` and
    # `type: readme` are rpm markers (%license, %doc) and nfpm drops an entry
    # carrying one from the deb without saying so - which is how the v0.5.0 deb
    # shipped with nothing but /usr/bin/monmux, no copyright file, against
    # Debian policy. The rpm keeps its markers; the deb gets plain files.
    #
    # file_info.mtime as well as the package mtime above: a declared entry keeps
    # the mtime of the file on the runner, the checkout time, unless told
    # otherwise, and that would undo the reproducibility the mtime above buys.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/monmux/copyright
        type: license
        packager: rpm
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        dst: /usr/share/doc/monmux/copyright
        packager: deb
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/monmux/README.md
        type: readme
        packager: rpm
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/monmux/README.md
        packager: deb
        file_info:
          mtime: "{{ .CommitDate }}"

# macOS only, which a cask is by nature, and which is what monmux supports:
# m1ddc requires Apple Silicon.
homebrew_casks:
  - name: monmux
    ids:
      - monmux-darwin
    binaries:
      - monmux
    directory: Casks
    homepage: https://github.com/leinardi/monmux
    description: Switch supported monitors between video inputs
    license: Apache-2.0
    # A prerelease tag never reaches the tap.
    skip_upload: auto
    dependencies:
      - formula: m1ddc
    repository:
      owner: leinardi
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(cask): monmux {{ .Tag }}"
    # The binaries carry no Apple Developer ID signature, and Homebrew
    # quarantines everything it downloads, so without this Gatekeeper refuses to
    # run the binary at all. What stripping the attribute bypasses, and how to
    # install without it, is spelled out in docs/security.md.
    #
    # A custom_block, not hooks.post.install: goreleaser renders that as a Ruby
    # `postflight` block, which Homebrew deprecated in favour of the declarative
    # `postflight_steps`, and every brew command touching the cask warned about
    # it. The whole cask is rendered as a template, so Homebrew's own
    # `{{staged_path}}` token has to be escaped.
    #
    # Workaround for https://github.com/goreleaser/goreleaser/issues/6870, fixed
    # by https://github.com/goreleaser/goreleaser/pull/6873. Once a goreleaser
    # release carries hooks.post.install_steps: bump GORELEASER_VERSION in both
    # workflows, move this block there, and drop the stanza-order note below.
    #
    # custom_block lands right after `cask "monmux" do`, ahead of the artifact
    # stanzas. `brew style` flags that order; installing does not care. The move
    # to install_steps puts the stanza back where Homebrew expects it.
    #
    # must_succeed: false is what the old system_command did too - it never
    # raised - and it has to stay: `xattr -d` exits 1 when the attribute is not
    # there, which would fail the whole install over nothing. stderr stays
    # visible, so a real failure is still on screen.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:         ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/monmux"],
              must_succeed: false
        end
      end

changelog:
  # `git`, not `github`: the workflow builds before the tag is pushed, and the
  # GitHub compare API cannot see a tag that exists only locally.
  use: git
  sort: asc
  groups:
    # A catalog change decides which bytes reach which monitor, so it is read
    # first. The release header, generated from models.yaml itself, says what
    # actually changed; this only groups the commits.
    - title: Catalog
      regexp: '^.*?(feat|fix)\(catalog\)!?:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"
      - "^test"
      - "^style"
      - "^Merge branch"
      - "^Merge pull request"

release:
  github:
    owner: leinardi
    name: monmux
  draft: false
  prerelease: auto
  make_latest: true
  # A re-run of a failed publish refreshes the release rather than adding a
  # second copy of every asset. Tags are immutable in this repository, so a
  # recovery run is the only way back - see docs/release.md.
  mode: replace
  replace_existing_artifacts: true
  target_commitish: "{{ .FullCommit }}"
  footer: |
    ## Install

    macOS:

    ```sh
    brew install --cask leinardi/tap/monmux
    ```

    Linux: the apt and rpm repositories are set up in the
    [README](https://github.com/leinardi/monmux#install), or download a tarball below.

    ## Verify a download

    ```sh
    sha256sum --check --ignore-missing checksums.txt
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity 'https://github.com/leinardi/monmux/.github/workflows/release.yaml@refs/heads/main' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify monmux_{{ trimprefix .Tag "v" }}_linux_amd64.tar.gz \
      --repo leinardi/monmux \
      --signer-workflow leinardi/monmux/.github/workflows/release.yaml \
      --source-ref refs/heads/main
    ```

    `checksums.txt` covers every artifact here, the packages included, so a package installed
    from Cloudsmith can be checked against this release.
