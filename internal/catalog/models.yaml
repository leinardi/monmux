# The supported-monitor catalog: the complete set of bytes monmux is willing to
# send to a monitor, with the evidence for each one next to it.
#
# This file is the source of truth. internal/catalog/models_gen.go is rendered
# from it and is what the binary compiles; nothing reads this file at run time.
# After editing, run `make go-generate` and commit both files. A test fails the
# build if the two ever disagree.
#
# Rules for editing it, enforced by the generator and by the tests in
# catalog_test.go, and spelled out in docs/adding-a-monitor.md:
#
#   - A write-enabled model needs at least one EDID identity. An entry with no
#     identities can never match, and so can never be written to.
#   - A model that is not write-enabled must record no identities at all, so it
#     cannot match a display in the first place.
#   - Every input carries its own evidence, and the evidence carries a grade.
#     "Another model in the same family uses this value" is not evidence.
#   - A write-enabled model needs the grade `verified` on every one of its
#     inputs: a value nobody ran on that unit never becomes writable.
#   - A value that has not been observed on the model itself, or confirmed for
#     that exact model by a named source, does not go in.
#
# Inputs are keyed by the symbolic name typed on the command line: a connector
# kind (dp, hdmi, usb-c, dvi, vga, thunderbolt) plus an optional port number
# (hdmi1, usb-c2). Write a kind bare when the model has one port of it, numbered
# when it has several; never both. The mechanism is a per-model property and
# never a fallback. Two are implemented: lg-alt-input, the LG side channel
# (source address 0x50, VCP 0xF4), and vcp-input-source, the standard Input
# Source feature (VCP 0x60). Only the first has ever reached a monitor.
#
# An identity may pin `model_name`, the EDID descriptor 0xFC text, because LG
# assigns one product code to several products. Leave it out unless two models
# have to share a code: a bare identity next to a pinned one is rejected.
#
# The evidence of an input is a record, not a sentence. The generator composes
# the sentence that reaches models_gen.go and docs/compatibility.md, so every
# entry of one grade reads the same way:
#
#   grade: verified    a direct test on the unit; needs date, tool and note
#   grade: documented  the manufacturer documents it; needs by and url
#   grade: reported    somebody reports switching that input; needs by, tool, url
#   grade: quoted      somebody quotes the values and says they work, without
#                      saying which inputs were tried; needs by, tool, url
#
# `note` is optional free text folded into the sentence. No field rendered into
# the document - by, tool, date, url, note, a note entry or a source - may hold
# a `|` or a newline, because the document test reads Markdown table cells and
# single-line bullets.
#
# `notes` is per-model prose: negative reports, conflicts, aliases and quirks.
# It is rendered under the model in docs/compatibility.md and is never an
# Operation, so nothing written there can reach a monitor.

models:
  - name: 38WR85QC-W
    vendor: LG
    identities:
      - manufacturer: GSM
        product_code: 0x77D3
      - manufacturer: GSM
        product_code: 0x77D4
    write_enabled: true
    inputs:
      dp:
        mechanism: lg-alt-input
        value: 0xD0
        evidence:
          grade: verified
          tool: "Linux (ddcutil) and macOS (m1ddc)"
          date: "2026-09-07"
          note: "switched from USB-C to DisplayPort"
      usb-c:
        mechanism: lg-alt-input
        value: 0xD1
        evidence:
          grade: verified
          tool: "Linux (ddcutil) and macOS (m1ddc)"
          date: "2026-09-07"
          note: "switched from DisplayPort to USB-C"
    notes:
      - "Two identities, because the same physical unit reports `GSM/0x77D3` while displaying DisplayPort and `GSM/0x77D4` while displaying USB-C. Both were observed directly; the model string is `LG ULTRAWIDE`, which is not used for matching."
      - "`hdmi1` and `hdmi2` are deliberately absent rather than disabled. The values were never tested on this unit, and another LG model using them is not evidence for this one. Asking for them is refused with `input-not-enabled`. Several sources say the HDMI inputs of a 38WR85QC-W respond to `0x90` and `0x91`; because this model is write-enabled, recording them would enable a write, so they stay out until somebody runs them on this unit by hand, the way [testing.md](testing.md) describes."
    sources:
      - "Direct observation on the tested unit: EDID GSM/0x77D3 (DisplayPort) and GSM/0x77D4 (USB-C), model string LG ULTRAWIDE"
      - https://github.com/rockowitz/ddcutil/wiki/Switching-input-source-on-LG-monitors

