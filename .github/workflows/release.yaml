name: Release

# Fully automatic from one dispatch: it resolves the version, writes the catalog
# section of the release notes, tags, builds, signs, publishes the GitHub
# release, pushes the Homebrew cask and uploads the packages to Cloudsmith.
#
# No step runs monmux and no step touches a monitor. The order of the release
# job is deliberate: everything that can fail does so before the tag exists,
# because tags in this repository are immutable and cannot be cleaned up after a
# failure. docs/release.md is the prose version of that, with the recovery
# procedure.
#
# Nothing CI already proved is run again: the ci-green job requires ci.yaml's
# ci-result to have passed on the push of this exact commit. Only the
# time-sensitive check, govulncheck, runs again here, in the audit job, beside
# the build rather than ahead of it.
on:
  workflow_dispatch:
    inputs:
      # Left empty, the version comes from the Conventional Commits since the last
      # tag. An explicit one is checked for shape and for being higher than every
      # released version, and is how a recovery re-run names the version it failed
      # on. Either way the catalog rule may raise it.
      version:
        description: "Version, e.g. 0.1.0 (empty: derive from the commits)"
        required: false
      # Resolves the version, writes the release notes, builds and signs, and stops
      # there: no tag is pushed, no release, cask or package is published.
      dry_run:
        description: "Dry run: build and sign, stop before the tag is pushed"
        type: boolean
        default: false

# One release at a time, and never cancelled. Two dispatches in flight together
# would each check "higher than every released version" against the same latest
# tag, both pass, and then publish in whatever order they happened to finish - a
# lower version landing last would take `latest` with it. A second dispatch waits
# for the first instead of racing it, and a run that has started is never killed
# part-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Exact, not "~> v2": a recovery re-run of a tagged commit has to rebuild the
  # same artifacts, and a goreleaser released in the meantime could change them.
  GORELEASER_VERSION: v2.18.1
  # The one definition of a release tag: vMAJOR.MINOR.PATCH, strict SemVer core
  # with no leading zeros, no pre-release and no build metadata, the same regex
  # release-version uses. The checks below that release-version does not make
  # filter the full tag list through it with grep -E, never through a glob:
  # `v[0-9]*.[0-9]*.[0-9]*` also matches v1.2.3-rc.1, v1.2.3+meta and
  # v1foo.2bar.3baz.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

jobs:
  # workflow_dispatch lets the caller pick any branch, and the release job holds
  # contents: write, an OIDC identity and the tap token. Dispatched from a side
  # branch it would tag that branch's tree, publish it as a release and push a
  # cask for it. This fails rather than skips, so such a run is red and not a
  # green no-op, and ci-green and the release job wait on it (the read-only
  # audit does not).
  #
  # The ruleset cannot express this: tag protection stops a tag moving, not a tag
  # being created from the wrong commit. The second line of defence is the
  # `release` environment, whose deployment branch rule is configured by hand -
  # docs/release.md.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refuse to release anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release runs from main only (got $REF). Nothing was tagged or published." >&2
            exit 1
          fi

  # The release-time test, cross and govulncheck jobs are replaced by this gate:
  # CI (ci.yaml) must have passed on this exact commit, on its push to main. Its
  # ci-result needs the same jobs the release used to repeat - go-test.yaml on
  # Linux and macOS, the cross-OS build, vet and lint, govulncheck - plus
  # pre-commit over every file, the native macOS lint, the script tests and
  # `goreleaser check`. The binaries are not built by CI: the release job below
  # still builds, packages and signs them, with goreleaser.
  ci-green:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read # require-ci-green reads ci.yaml's runs and jobs

    steps:
      - name: Require CI green on this commit
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          accepted-events: push

  # The time-sensitive check: advisories are published every day, so the
  # dependencies CI passed are scanned again now. It needs nothing and nothing
  # needs it, so it runs alongside guard, ci-green and the release job's build;
  # the release job waits for it to pass, in this run attempt, right before its
  # first step that publishes anything.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not golang/govulncheck-action: it always forwards its own
      # go-version-input (default "stable") to setup-go, where it wins over
      # go-version-file, so go.mod was ignored and the scan ran on a toolchain
      # that is not the one goreleaser builds with. Its standard-library findings
      # then describe a binary nobody ships. These two steps are all the action
      # did, minus that. No cache: the release restores nothing CI saved.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Scan the module for known vulnerabilities
        # The pinned govulncheck in .mk/audit-deps.mk, the same target the
        # pre-commit hook runs. Pinning the scanner does not pin what it knows:
        # the vulnerability database is fetched at run time.
        run: make audit-deps

  release:
    needs:
      - guard
      - ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Created on first run with no protection rules, which changes nothing by
    # itself. Add a deployment branch rule limiting it to `main`, and required
    # reviewers if a release should need a second pair of eyes - docs/release.md.
    environment: release
    permissions:
      contents: write # create the tag and the release
      id-token: write # cosign keyless signing, provenance, Cloudsmith OIDC
      attestations: write # provenance attestation upload
      actions: read # require-job-success reads the audit job of this run

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-version reads the tags and the commits since the last one,
          # and goreleaser needs the whole history for the changelog.
          fetch-depth: 0
          fetch-tags: true
          # The repository is public, so the tag checks' git ls-remote needs no
          # token; the tag push is handed one for that command alone.
          persist-credentials: false

      # Everything the publishing half needs, checked before anything is built
      # and long before the tag is pushed. Without this, a missing tap token or
      # an unset Cloudsmith slug fails after the point of no return, which is
      # recoverable but pointless.
      - name: Check the publishing credentials
        if: ${{ !inputs.dry_run }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$HOMEBREW_TAP_TOKEN" ] || missing="$missing HOMEBREW_TAP_TOKEN(secret)"
          [ -n "$CLOUDSMITH_SERVICE_SLUG" ] || missing="$missing CLOUDSMITH_SERVICE_SLUG(variable)"
          if [ -n "$missing" ]; then
            echo "Not configured:$missing. See docs/release.md, 'Before the first release'." >&2
            exit 1
          fi

      # No cache, restored or saved: the release builds from a clean module and
      # build cache, and nothing a CI run saved reaches the release binaries.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Only to derive a version: a version typed by hand releases even while
      # GitHub's release downloads fail.
      - name: Install svu
        if: inputs.version == ''
        uses: leinardi/gh-composite-actions/setup-svu@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      # Explicit, or derived by svu from the commits since the highest strict
      # vX.Y.Z tag reachable from HEAD; higher than every release already
      # tagged, except a recovery: this exact tag already on HEAD.
      # docs/release.md has the rules.
      - name: Resolve the version to release
        id: version
        uses: leinardi/gh-composite-actions/release-version@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          version: ${{ inputs.version }}

      # release-version lets a recovery re-run reuse its version whatever was
      # released since. Not here: goreleaser marks every release it publishes
      # as latest and pushes its cask to the tap, so re-running an older version
      # would hand both an older binary. The tag is on HEAD, so the tag list
      # always holds a release tag and grep cannot come back empty.
      - name: Refuse to recover a version below the latest release
        if: steps.version.outputs.recovery == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          LATEST=$(git tag --list | grep -E "$RELEASE_TAG_REGEX" | sort -V | tail -n1)
          if [ "$LATEST" != "$TAG" ]; then
            echo "$TAG already points at this commit, but $LATEST is a higher release. Re-running $TAG would make it latest again and push its cask over $LATEST's. Recover it by hand - docs/release.md." >&2
            exit 1
          fi
          echo "Re-running the release of $TAG, which already points at this commit."

      # The catalog section of the release notes, generated from models.yaml
      # itself: generated commit notes cannot know that a release writes
      # something the previous one refused. The tool also reports enabled=,
      # which the next step turns into the version rule.
      - name: Write the catalog release notes
        id: catalog
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          mkdir -p dist-notes

          if [ -n "$PREVIOUS" ]; then
            git show "$PREVIOUS:internal/catalog/models.yaml" > dist-notes/previous.yaml
          else
            # No previous tag: the first release compares against an empty
            # catalog, so everything in it is new.
            : > dist-notes/previous.yaml
          fi

          go run ./internal/catalog/internal/generate/cmd/relnotes \
            -previous "${PREVIOUS:-the previous release}" \
            -status "$GITHUB_OUTPUT" \
            dist-notes/previous.yaml internal/catalog/models.yaml > dist-notes/header.md

          cat dist-notes/header.md

      # "Any change to models.yaml that adds or moves a byte monmux can send is
      # at least a minor release." Recording an entry counts: --unsafe-model
      # reaches it through catalog.Model.UnsafeOperation, which ignores
      # write_enabled. A derived patch bump is raised to a minor and said so; an
      # explicit patch is refused, because the rule outranks the input.
      - name: Apply the catalog version rule
        id: final
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          EXPLICIT: ${{ steps.version.outputs.explicit }}
          ENABLED: ${{ steps.catalog.outputs.enabled }}
        run: |
          set -euo pipefail

          if [ "$ENABLED" = "true" ] && [ -n "$PREVIOUS" ] && [ "${VERSION%.*}" = "${PREVIOUS%.*}" ]; then
            # The next minor after PREVIOUS, vX.Y.Z to vX.(Y+1).0: what
            # `svu minor` printed, without needing svu for an explicit version.
            # PREVIOUS is a strict release tag, so the split is exact.
            IFS=. read -r MAJOR MINOR_NUMBER _ <<<"${PREVIOUS#v}"
            MINOR="v${MAJOR}.$((MINOR_NUMBER + 1)).0"
            if [ "$EXPLICIT" = "true" ]; then
              echo "This release adds or moves bytes monmux can send to a monitor, which is never a patch. Re-run with $MINOR or later." >&2
              exit 1
            fi
            VERSION="$MINOR"
            echo "::notice::This release adds or moves bytes monmux can send to a monitor, so the patch bump was raised to $VERSION."
          fi

          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag that already exists is either a re-run recovering a failed publish
      # - it points at this commit, and the run continues without pushing it
      # again - or a different commit, which nothing here may overwrite: tags in
      # this repository are immutable, on purpose.
      - name: Check the tag
        id: tag
        env:
          VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail

          HEAD_SHA=$(git rev-parse HEAD)
          # Its own assignment, so a failed ls-remote stops the step under set -e
          # instead of reading as "no such tag"; only an answer that names
          # neither ref is "absent". The peeled line (^{}) is the commit an
          # annotated tag points at.
          REMOTE_REFS=$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          REMOTE=$(awk -v ref="refs/tags/$VERSION" '$2 == ref {print $1}' <<<"$REMOTE_REFS")
          PEELED=$(awk -v ref="refs/tags/$VERSION^{}" '$2 == ref {print $1}' <<<"$REMOTE_REFS")

          if [ -n "$REMOTE" ]; then
            POINTS_AT="${PEELED:-$REMOTE}"
            if [ "$POINTS_AT" != "$HEAD_SHA" ]; then
              echo "$VERSION already exists and points at $POINTS_AT, not at $HEAD_SHA. Tags here are immutable: release a new version instead." >&2
              exit 1
            fi
            echo "$VERSION already exists on this commit: recovering a failed publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            LOCAL=$(git rev-list -n1 "$VERSION")
            if [ "$LOCAL" != "$HEAD_SHA" ]; then
              echo "The local tag $VERSION points at $LOCAL, not at $HEAD_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "monmux $VERSION"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check .goreleaser.yaml
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      # Builds, archives, packages, checksums and signs, with nothing published.
      # A configuration error, a build error or a cosign error stops the run
      # here, with no tag on the remote.
      - name: Build and sign everything, publish nothing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish --release-header=dist-notes/header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The audit runs alongside this job rather than before it, so the build
      # does not wait for the advisories; nothing is published until it has
      # passed in this run attempt. An earlier attempt's pass never counts, so a
      # recovery uses "Re-run all jobs", never "Re-run failed jobs" -
      # docs/release.md. A dry run waits for it too, so it reports the audit a
      # real run would face.
      - name: Require the audit to have passed
        uses: leinardi/gh-composite-actions/require-job-success@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          job: audit
          timeout: "15"

      # The last look before the point of no return. Concurrency serializes the
      # workflow, but a tag can also arrive from outside it, and the
      # monotonicity check ran before several minutes of building. This asks
      # the remote, not the local clone, and it asks now. A dry run makes the
      # same check, so it fails where the real run would.
      - name: Gate the tag
        if: ${{ steps.tag.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.final.outputs.version }}
        run: |
          set -euo pipefail

          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)

          if [ -n "$HIGHEST_REMOTE" ] && [ "$HIGHEST_REMOTE" != "$VERSION" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$HIGHEST_REMOTE" | sort -V | tail -n1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "$HIGHEST_REMOTE was published while this run was building, so $VERSION would be a lower tag marked latest. Nothing was pushed; release a higher version." >&2
              exit 1
            fi
          fi

      - name: Report what a real run would publish
        if: inputs.dry_run
        env:
          VERSION: ${{ steps.final.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          ENABLED: ${{ steps.catalog.outputs.enabled }}
        run: |
          set -euo pipefail
          {
            echo "# Dry run: $VERSION"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Catalog enables something: $ENABLED."
            echo
            echo "No tag was created and nothing was published."
            echo
            cat dist-notes/header.md
            echo
            if [ -f dist/CHANGELOG.md ]; then
              cat dist/CHANGELOG.md
            fi
            echo
            echo '## Artifacts'
            echo
            echo '```text'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unpublished artifacts for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-${{ steps.final.outputs.version }}
          path: dist

      # The point of no return. Everything after it is idempotent, so a re-run
      # with the same explicit version recovers a failed publish. The token
      # reaches this one git command as a header, never the clone's config.
      - name: Push the tag
        if: ${{ !inputs.dry_run && steps.tag.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.final.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "refs/tags/$VERSION"

      - name: Publish the release, the packages and the cask
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-header=dist-notes/header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attest the build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

      - name: Set up the Cloudsmith CLI
        if: ${{ !inputs.dry_run }}
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b # v3.2.1
        with:
          oidc-namespace: leinardi
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          verify-auth: "true"

      # --republish so that a re-run overwrites the same version rather than
      # failing on it. The packages are the ones the release carries, and
      # checksums.txt covers them, so a user can verify a Cloudsmith download
      # against GitHub.
      - name: Upload the packages to Cloudsmith
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for package in dist/*.deb; do
            cloudsmith push deb leinardi/monmux/any-distro/any-version "$package" --republish
          done
          for package in dist/*.rpm; do
            cloudsmith push rpm leinardi/monmux/any-distro/any-version "$package" --republish
          done

      - name: Summarize the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.final.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          ENABLED: ${{ steps.catalog.outputs.enabled }}
        run: |
          set -euo pipefail
          {
            echo "# Released $VERSION"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Catalog enables something: $ENABLED."
            echo
            echo "- [Release](https://github.com/leinardi/monmux/releases/tag/$VERSION)"
            echo "- [Packages](https://cloudsmith.io/~leinardi/repos/monmux/packages/)"
            echo "- [Cask](https://github.com/leinardi/homebrew-tap/blob/main/Casks/monmux.rb)"
            echo
            cat dist-notes/header.md
          } >> "$GITHUB_STEP_SUMMARY"
