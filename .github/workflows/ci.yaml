name: CI

# No job here runs monmux against hardware. There is no monitor in CI, and the
# rule that no automation writes to a monitor is not suspended because the
# automation is called a workflow - AGENTS.md, docs/testing.md. The test suite
# refuses to start a process by construction, so a runner needs neither ddcutil
# nor m1ddc installed.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # The same pin the release workflow uses, so `goreleaser check` here validates
  # against the binary that will actually build the release.
  GORELEASER_VERSION: v2.18.1

concurrency:
  # A pull request's runs share one group per branch, so a newer push cancels the older run. Every
  # other run (a push to main, a dispatch) gets a group of its own: GitHub keeps only one pending
  # run per group, so a shared group would let a newer push replace a queued run, and the release
  # gate (require-ci-green) needs CI to have passed on that exact commit.
  group: "${{ github.workflow }} @ ${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The gate for every hook: all of them, on every file, on every run. The reviewdog jobs below only
  # annotate a pull request's diff.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go-generate-catalog, docs-links and the golangci-lint hooks run the Go toolchain, and it
      # has to be the one go.mod asks for.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Restore only, from the entry go-cache-warmup.yaml saves on main (go-test.yaml has the key
      # and its fallbacks): setup-go's own cache would save from pull requests too.
      - name: Locate the Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key, with the
      # same Python and pre-commit versions as above. The hook environments are bound to the
      # interpreter that built them, so the resolved Python version is part of the key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # Skipped here because a dedicated job runs each of them: go-test-repo-mod is `test`, on
      # both OSes, and audit-deps-go is `govulncheck`.
      - name: Run every pre-commit hook on every file
        env:
          SKIP: go-test-repo-mod,audit-deps-go
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier, golangci-lint fmt, go-generate-catalog); this also fails on a
      # file a hook creates, which its diff check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The shell tests of the hook scripts. They drive git in scratch repositories and run
  # nothing else; the Go suite cannot hold them, because it never starts a process.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test check-license-headers.sh
        run: bash scripts/check-license-headers.test.sh

  # Defined in go-test.yaml so go-cache-warmup.yaml runs the identical jobs on main and saves the
  # cache every other run restores. Linux and macOS, because a backend's build-tagged tests only
  # ever compile on their own OS.
  test:
    uses: ./.github/workflows/go-test.yaml
    permissions:
      contents: read

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Restore only, from the entry go-cache-warmup.yaml saves on main (go-test.yaml has the key
      # and its fallbacks): setup-go's own cache would save from pull requests too.
      - name: Locate the Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Read the golangci-lint version from .pre-commit-config.yaml
        id: linter
        run: |
          set -euo pipefail
          VERSION=$(grep -A1 'repo: https://github.com/golangci/golangci-lint$' .pre-commit-config.yaml \
            | grep 'rev:' \
            | sed 's/.*rev:[[:space:]]*//')
          if [ -z "$VERSION" ]; then
            echo "No golangci-lint rev found in .pre-commit-config.yaml" >&2
            exit 1
          fi
          echo "Using golangci-lint $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.linter.outputs.version }}
          install-only: true
          # Install only: the lint cache the action restores and saves is never handed to
          # `make go-lint-cross`, so it would only spend the cache quota.
          skip-cache: true

      - name: Compile-check both OS backends
        run: make go-build-cross

      - name: Vet both OS backends
        run: make go-vet-cross

      # If this fails inside GOROOT rather than inside this repository, the
      # linter is older than the toolchain - .mk/cross.mk says what to do.
      - name: Lint both OS backends
        run: make go-lint-cross

  lint-macos:
    # The only native look at internal/backend/m1ddc, which is behind
    # //go:build darwin and therefore invisible to a linter running on Linux.
    # `cross` narrows that gap from the Linux side; this closes it.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Restore only, from the entry go-cache-warmup.yaml saves on main (go-test.yaml has the key
      # and its fallbacks): setup-go's own cache would save from pull requests too.
      - name: Locate the Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Read the golangci-lint version from .pre-commit-config.yaml
        id: linter
        run: |
          set -euo pipefail
          VERSION=$(grep -A1 'repo: https://github.com/golangci/golangci-lint$' .pre-commit-config.yaml \
            | grep 'rev:' \
            | sed 's/.*rev:[[:space:]]*//')
          if [ -z "$VERSION" ]; then
            echo "No golangci-lint rev found in .pre-commit-config.yaml" >&2
            exit 1
          fi
          echo "Using golangci-lint $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint the macOS backend natively
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.linter.outputs.version }}
          args: ./...
          # The lint cache is written on main only, like every other cache here: a pull request
          # can read main's entries, and nothing a pull request saves is readable elsewhere.
          skip-save-cache: ${{ github.ref != 'refs/heads/main' }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not golang/govulncheck-action: it always forwards its own
      # go-version-input (default "stable") to setup-go, where it wins over
      # go-version-file, so go.mod was ignored and the scan ran on a toolchain
      # that is not the one the release builds with. Its standard-library findings
      # then describe a binary nobody ships. These two steps are all the action
      # did, minus that.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Restore only, from the entry go-cache-warmup.yaml saves on main (go-test.yaml has the key
      # and its fallbacks): setup-go's own cache would save from pull requests too.
      - name: Locate the Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Scan the module for known vulnerabilities
        # The pinned govulncheck in .mk/audit-deps.mk, the same target the
        # pre-commit hook runs. Pinning the scanner does not pin what it knows:
        # the vulnerability database is fetched at run time.
        run: make audit-deps

  release-config:
    # The release configuration is checked on every run rather than only when
    # .goreleaser.yaml changes: the build ids it names live in the Makefile and
    # in cmd/, so a change elsewhere can invalidate it, and the check costs
    # seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check .goreleaser.yaml
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  actionlint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # go-generate-catalog and the golangci-lint hooks run the Go toolchain,
      # and it has to be the one go.mod asks for. The composite action installs
      # pre-commit but no Go.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Restore only, from the entry go-cache-warmup.yaml saves on main (go-test.yaml has the key
      # and its fallbacks): setup-go's own cache would save from pull requests too.
      - name: Locate the Go caches
        id: go-env
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-

      # go-test-repo-mod is deliberately absent: `test` above is the real thing
      # and runs on both OSes. go-generate-catalog is deliberately present: a
      # pull request that edits models.yaml without regenerating what is built
      # from it gets the diff posted as a review comment.
      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            checkmake
            go-generate-catalog
            prettier-yaml
            golangci-lint-config-verify
            golangci-lint-fmt
            golangci-lint-full

  markdownlint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # The release version is derived from the commit types since the last tag,
    # so a commit nobody can classify is a release nobody can version.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The one required check: it needs every gating job, so the ruleset names this job alone. It is
  # also what the release gates on: release.yaml's require-ci-green waits for this job to have
  # passed on the push of the exact commit it releases, in place of re-running the jobs it needs.
  # conventional-commits runs on pull requests only, so off them its "skipped" is not a failure.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - scripts
      - test
      - cross
      - lint-macos
      - govulncheck
      - release-config
      - conventional-commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
