version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # fix, not chore: the release version is derived from commit types, so a
    # Go dependency bump (security fixes included) produces a patch release.
    # The other ecosystems stay chore(deps) and bump nothing.
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      go-modules:
        patterns:
          - "*"
